<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>夢Rikyu スタッフシフトポータル</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; color: #333; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; text-align: center; margin-bottom: 15px; }
    h2, h3 { margin-top: 0; color: #2c3e50; }
    
    /* ボタンデザイン */
    .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-sizing: border-box; }
    .btn-blue { background: #007bff; color: white; }
    .btn-green { background: #28a745; color: white; }
    .btn-gray { background: #6c757d; color: white; }
    .btn-outline { background: white; color: #333; border: 1px solid #ccc; }
    
    /* ページ切り替え用 */
    .page { display: none; }
    .page.active { display: block; }

    /* シフト確認用テーブル（元のコードのまま） */
    .table-container { overflow: auto; max-height: 70svh; border: 1px solid #ddd; border-radius: 8px; }
    table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
    th, td { border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 12px 10px; text-align: center; white-space: nowrap; }
    th { background: #007bff; color: white; position: sticky; top: 0; z-index: 10; }
    td:first-child { position: sticky; left: 0; background: #f8f9fa; font-weight: bold; z-index: 8; }
    
    /* 提出用カレンダーグリッド */
    .submit-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 15px; text-align: left;}
    .submit-day { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .submit-day:active { background: #f8f9fa; }
    .day-label { font-weight: bold; font-size: 16px; width: 60px;}
    .shift-status { flex-grow: 1; text-align: right; font-size: 15px; }

    /* シフトの状態表示（色に頼らない） */
    .status-off { color: #888; text-decoration: line-through; }
    .badge-off { font-size: 12px; font-weight:bold; margin-left: 5px; }
    .status-add { font-weight: bold; border-bottom: 1px dashed #333; }
    .status-change { font-weight: bold; }
    .old-time { font-size: 11px; text-decoration: line-through; color: #777; display: block; line-height: 1; margin-bottom: 3px;}

    /* モーダル */
    #timeModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; }
    .time-selectors { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 20px 0; }
    select { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }

    #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ローディング -->
  <div id="loadingOverlay">
    <div style="text-align:center;">
      <p style="font-size:24px; margin:0;">🚗</p><p>通信中...</p>
    </div>
  </div>

  <!-- ページ1: トップメニュー -->
  <div id="page-home" class="page active card">
    <h2>🏠 夢Rikyu<br>スタッフシフトポータル</h2>
    <p style="color: #666; font-size: 14px;">メニューを選択してください</p>
    <button class="btn btn-blue" onclick="navTo('page-view'); loadStaffShiftData('latest');">👀 シフト確認</button>
    <button class="btn btn-green" onclick="navTo('page-submit-name')">📝 来月のシフト提出</button>
  </div>

  <!-- ページ2A: シフト確認（既存のもの） -->
  <div id="page-view" class="page card">
    <h3>👤 シフト確認</h3>
    <select id="targetMonthSelect" onchange="onMonthChange()" style="width:100%; padding:10px; margin-bottom:10px;">
      <option value="latest">📅 最新（今月）のシフト</option>
      <option value="prev">📅 前月のシフト</option>
    </select>
    <div class="table-container" id="tableContainer">
      <div style="padding: 40px 0; color: #888;">読み込み中...</div>
    </div>
    <button class="btn btn-outline" onclick="navTo('page-home')" style="margin-top: 15px;">戻る</button>
  </div>

  <!-- ページ2B-1: シフト提出（名前選択） -->
  <div id="page-submit-name" class="page card">
    <h3>📝 翌月シフト希望提出</h3>
    <p style="font-size:13px; color:#666;">あなたの名前を選択してください</p>
    
    <select id="requestNameSelect" style="width:100%; padding:15px; margin-bottom: 20px; font-weight:bold;">
      <option value="">👤 名前を選択...</option>
      <!-- GASから取得するか、HTMLに直接書く -->
      <option value="Aさん_fixed">Aさん（休み希望ベース）</option>
      <option value="Bさん_free">Bさん（出勤可能ベース）</option>
    </select>

    <button class="btn btn-green" onclick="startShiftRequest()">次へ（カレンダーへ）</button>
    <button class="btn btn-outline" onclick="navTo('page-home')">戻る</button>
  </div>

  <!-- ページ2B-2: シフト提出（カレンダー入力） -->
  <div id="page-submit-calendar" class="page card" style="padding: 10px;">
    <h3 id="requestMonthTitle" style="margin-bottom: 5px;">来月のシフト希望</h3>
    <p id="requestingNameDisplay" style="font-size:14px; color:#007bff; margin-top:0; font-weight:bold;"></p>
    
    <div id="submitCalendarGrid" class="submit-grid">
      <!-- ここにJSで日付リストが生成されます -->
    </div>
    
    <button class="btn btn-blue" onclick="submitRequestToGAS()" style="margin-top: 20px;">📤 この内容で提出する</button>
    <button class="btn btn-outline" onclick="navTo('page-submit-name')">戻る</button>
  </div>

  <!-- モーダル: 時間選択 -->
  <div id="timeModal">
    <div class="modal-content">
      <h3 id="modalDateLabel">10月1日 (火)</h3>
      <p style="font-size: 13px; color: #666;">出勤希望時間を入力、または休みを選択してください。</p>
      
      <div class="time-selectors">
        <select id="modalStart">
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="12:00">12:00</option>
          <option value="17:00">17:00</option>
        </select>
        <span>〜</span>
        <select id="modalEnd">
          <option value="15:00">15:00</option>
          <option value="19:00">19:00</option>
          <option value="LAST">LAST</option>
        </select>
      </div>

      <button class="btn btn-blue" onclick="saveModalTime()">💾 決定する</button>
      <button class="btn" style="background:#e74c3c; color:white;" onclick="setModalOff()">❌ 休み希望にする</button>
      <button class="btn btn-gray" onclick="resetModal()">🔄 元に戻す（リセット）</button>
      <button class="btn btn-outline" onclick="closeModal()">キャンセル</button>
    </div>
  </div>

  <script>
// --- SPA ナビゲーション ---
    function navTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
    }

    function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

    const GAS_URL = "https://script.google.com/macros/s/AKfycbwcpM3ildCLcNcIFJNlp_Nz7-ZKz6lS-WEjqZ3btnFPzWr98RhIAhHX-W4sRGVYmdzU/exec"; // あなたのGASのURL

    // ==========================================
    // 1. 初期起動時：社員名簿から名前リストを取得
    // ==========================================
    let staffMasterData = []; // 取得したデータを保存するハコ

    window.onload = function() {
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getStaffList' })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          staffMasterData = data.data; // [{name:"Aさん", rule:"月水10:00-19:00"}, ...]
          const select = document.getElementById('requestNameSelect');
          select.innerHTML = '<option value="">👤 名前を選択...</option>';
          
          staffMasterData.forEach(staff => {
            const opt = document.createElement('option');
            opt.value = staff.name;
            // E列に何かルールが書いてあれば「休み希望ベース」、空欄なら「出勤可能ベース」と表示
            const typeLabel = staff.rule ? "（休み希望）" : "（出勤ベース）";
            opt.innerText = `${staff.name} ${typeLabel}`;
            select.appendChild(opt);
          });
        }
      });
    };

    // ==========================================
    // 2. シフト確認画面（原因3の解決）
    // ==========================================
    function onMonthChange() {
      const type = document.getElementById('targetMonthSelect').value;
      loadStaffShiftData(type);
    }

    function loadStaffShiftData(type) {
      document.getElementById('tableContainer').innerHTML = '<div style="padding: 40px 0; color: #888;">読み込み中...</div>';
      
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getStaffShiftData', target: type })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          // 取得した2次元配列データからテーブル（表）を組み立てる
          let html = '<table>';
          data.data.forEach((row, rowIndex) => {
            html += '<tr>';
            row.forEach(cell => {
              if (rowIndex === 0) html += `<th>${cell}</th>`; // 1行目は見出し
              else html += `<td>${cell || ""}</td>`; // 空白なら空にする
            });
            html += '</tr>';
          });
          html += '</table>';
          document.getElementById('tableContainer').innerHTML = html;
        } else {
          document.getElementById('tableContainer').innerHTML = `<div style="color:red;">エラー: ${data.message}</div>`;
        }
      })
      .catch(err => {
        document.getElementById('tableContainer').innerHTML = `<div style="color:red;">通信エラーが発生しました</div>`;
      });
    }

    // ==========================================
    // 3. シフト提出用のロジック
    // ==========================================
    let requestData = [];
    let editingDayIndex = -1;
    let currentStaffRule = ""; // 選択した人のE列のルールを保持

    function startShiftRequest() {
      const selectedName = document.getElementById('requestNameSelect').value;
      if (!selectedName) { alert("名前を選択してください"); return; }

      // 選択された人のデータをマスターから探し出す
      const staffInfo = staffMasterData.find(s => s.name === selectedName);
      currentStaffRule = staffInfo ? staffInfo.rule : ""; // E列のルール文字
      
      document.getElementById('requestingNameDisplay').innerText = `👤 ${selectedName} さんの提出画面`;
      
      generateSubmitCalendar();
      navTo('page-submit-calendar');
    }

    function generateSubmitCalendar() {
      const grid = document.getElementById('submitCalendarGrid');
      grid.innerHTML = '';
      requestData = [];

      // 来月の日付リストを自動生成
      const today = new Date();
      const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      const year = nextMonth.getFullYear();
      const month = nextMonth.getMonth() + 1;
      const lastDay = new Date(year, month, 0).getDate(); 
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      
      const targetDays = [];
      for(let i = 1; i <= lastDay; i++) {
        let d = new Date(year, month - 1, i);
        targetDays.push(`${i}日(${dayNames[d.getDay()]})`);
      }

      // カレンダーの各マスの設定
      targetDays.forEach((dayStr, index) => {
        let baseShift = ""; 
        
        // 【簡易判定】もしルール(E列)に「10:00-19:00」のような文字があり、かつ該当の「曜日」が含まれていたら、それを初期値にする。
        // ※ルールの書き方によって調整が必要ですが、とりあえず「月水金 10-19」みたいな書き方に対応する簡易版です。
        if (currentStaffRule) {
          const dayChar = dayStr.match(/\((.*?)\)/)[1]; // "月" などを抽出
          if (currentStaffRule.includes(dayChar)) {
            // E列に書かれている時間を強引に抜き出す（例: 10:00-19:00など）
            const timeMatch = currentStaffRule.match(/\d{1,2}:\d{2}-\d{1,2}:\d{2}|LAST/);
            baseShift = timeMatch ? timeMatch[0] : "10:00-19:00"; 
          }
        }

        requestData.push({
          dateStr: dayStr,
          baseShift: baseShift, 
          requestedShift: baseShift, 
          isModified: false
        });

        const dayDiv = document.createElement('div');
        dayDiv.className = 'submit-day';
        dayDiv.id = `req-day-${index}`;
        dayDiv.onclick = () => openModal(index);
        grid.appendChild(dayDiv);
      });

      renderSubmitGrid();
    }

    // （これより下の renderSubmitGrid, openModal, closeModal, saveModalTime, setModalOff, resetModal, submitRequestToGAS は前回のコードをそのまま貼り付けてください！）

    function renderSubmitGrid() {
      requestData.forEach((data, index) => {
        const div = document.getElementById(`req-day-${index}`);
        let statusHtml = '<span style="color:#aaa;">未入力</span>';

        if (data.requestedShift === "OFF") {
          if (data.baseShift) {
            // 元々シフトがあったのに休む場合（休み希望）
            statusHtml = `<span class="status-off">${data.baseShift}</span><span class="badge-off">❌休</span>`;
          } else {
            // 元々ない日に「休」を入れた場合（表示しなくてもいいが念のため）
            statusHtml = `<span class="badge-off">❌休</span>`;
          }
        } else if (data.requestedShift) {
          if (!data.baseShift) {
            // 元々休みの日に追加する場合
            statusHtml = `<span class="status-add">${data.requestedShift}</span> <span class="badge-off">➕追加</span>`;
          } else if (data.baseShift !== data.requestedShift) {
            // 時間を変更する場合
            statusHtml = `<span class="old-time">${data.baseShift}</span><span class="status-change">${data.requestedShift}</span> <span class="badge-off">🕒変更</span>`;
          } else {
            // 固定シフトそのまま
            statusHtml = `<span>${data.requestedShift}</span>`;
          }
        }

        div.innerHTML = `
          <div class="day-label">${data.dateStr}</div>
          <div class="shift-status">${statusHtml}</div>
        `;
      });
    }

    // --- モーダル制御 ---
    function openModal(index) {
      editingDayIndex = index;
      const data = requestData[index];
      document.getElementById('modalDateLabel').innerText = data.dateStr;
      
      // セレクトボックスの初期値設定（あれば）
      if (data.requestedShift && data.requestedShift !== "OFF") {
        const parts = data.requestedShift.split('-');
        if(parts.length === 2) {
          document.getElementById('modalStart').value = parts[0].trim();
          document.getElementById('modalEnd').value = parts[1].trim();
        }
      }
      document.getElementById('timeModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('timeModal').style.display = 'none'; }

    function saveModalTime() {
      const start = document.getElementById('modalStart').value;
      const end = document.getElementById('modalEnd').value;
      requestData[editingDayIndex].requestedShift = `${start}-${end}`;
      requestData[editingDayIndex].isModified = true;
      renderSubmitGrid();
      closeModal();
    }

    function setModalOff() {
      requestData[editingDayIndex].requestedShift = "OFF";
      requestData[editingDayIndex].isModified = true;
      renderSubmitGrid();
      closeModal();
    }

    function resetModal() {
      // 初期状態（ベースシフト）に戻す
      requestData[editingDayIndex].requestedShift = requestData[editingDayIndex].baseShift;
      requestData[editingDayIndex].isModified = false;
      renderSubmitGrid();
      closeModal();
    }

    // --- GASへの送信 ---
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwcpM3ildCLcNcIFJNlp_Nz7-ZKz6lS-WEjqZ3btnFPzWr98RhIAhHX-W4sRGVYmdzU/exec"; // WebアプリのURL

    function submitRequestToGAS() {
      const staffName = document.getElementById('requestNameSelect').value.split('_')[0];
      
      const payload = {
        action: 'submitShiftRequest',
        staffName: staffName,
        requests: requestData.map(d => ({ date: d.dateStr, shift: d.requestedShift }))
      };

      // ローディング画面を表示してGASへ送信（本番用）
      showLoading();
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        hideLoading();
        if(data.status === "success") {
          alert("シフト希望を提出しました！");
          navTo('page-home'); // トップに戻る
        } else {
          alert("エラーが発生しました: " + data.message);
        }
      })
      .catch(err => {
        hideLoading();
        alert("通信エラー: " + err.message);
      });
    }


  </script>
</body>
</html>
